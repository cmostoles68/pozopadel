name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pendiente de configurar: hash bcrypt de la contraseña admin demo. Si no
      # está, la suite e2e de auth fallará al probar el login como admin.
      ADMIN_PASSWORD_HASH: "$2b$12$dgzvLAqY9Ng0KgnO0Od3Jeh7BlVeDl63vVqTUJxvnTKRKqyAj1PRe"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Supabase dev images
        uses: actions/cache@v4
        with:
          path: ~/.cache/supabase
          key: supabase-cache-${{ runner.os }}-${{ hashFiles('supabase/config.toml') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: |
          supabase start > /tmp/supabase-start.log 2>&1 || {
            tail -40 /tmp/supabase-start.log
            exit 1
          }
          tail -20 /tmp/supabase-start.log
          NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$(grep 'anon key:' /tmp/supabase-start.log | awk '{print $NF}')"
          SUPABASE_JWT_SECRET="$(grep 'JWT secret:' /tmp/supabase-start.log | awk '{print $NF}')"
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_JWT_SECRET=$SUPABASE_JWT_SECRET" >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nSUPABASE_JWT_SECRET=%s\n' \
            "$NEXT_PUBLIC_SUPABASE_URL" "$NEXT_PUBLIC_SUPABASE_ANON_KEY" "$SUPABASE_JWT_SECRET" \
            > .env.local
          cat .env.local | grep -v SECRET

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore